services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: webhooks
      POSTGRES_PASSWORD: webhooks
      POSTGRES_DB: webhooks_node
    ports:
      - "5532:5432"
    volumes:
      - node_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webhooks"]
      interval: 2s
      timeout: 2s
      retries: 15

  api:
    build: .
    command: sh -c "npm run migrate:prod && npm run start"
    environment:
      DATABASE_URL: postgres://webhooks:webhooks@postgres:5432/webhooks_node
      PORT: "3000"
      SECRET_ENCRYPTION_KEY: uVnfLJGuLvn8ZwxpLXFXIw8irrEhzVUIqM6SneLB6Sc=
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

  # Shared worker pool (DECISIONS.md): one process, not one per mechanism.
  # Currently runs expansion only; the delivery-claim loop from the
  # "Delivery worker: ordering, crash recovery, fairness, signing, backoff &
  # halt" ticket joins this same entrypoint rather than adding a service.
  worker:
    build: .
    command: sh -c "npm run migrate:prod && npm run start:worker"
    environment:
      DATABASE_URL: postgres://webhooks:webhooks@postgres:5432/webhooks_node
      SECRET_ENCRYPTION_KEY: uVnfLJGuLvn8ZwxpLXFXIw8irrEhzVUIqM6SneLB6Sc=
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  node_postgres_data:
