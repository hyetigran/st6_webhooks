services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: webhooks
      POSTGRES_PASSWORD: webhooks
      POSTGRES_DB: webhooks_go
    ports:
      - "5533:5432"
    volumes:
      - go_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webhooks"]
      interval: 2s
      timeout: 2s
      retries: 15

  api:
    build: .
    command: sh -c "./migrate && ./api"
    environment:
      DATABASE_URL: postgres://webhooks:webhooks@postgres:5432/webhooks_go
      PORT: "8090"
      SECRET_ENCRYPTION_KEY: uVnfLJGuLvn8ZwxpLXFXIw8irrEhzVUIqM6SneLB6Sc=
    ports:
      - "8090:8090"
    depends_on:
      postgres:
        condition: service_healthy

  # Shared worker pool (DECISIONS.md): one process, not one per mechanism —
  # runs expansion, delivery, and replay expansion in a single poll loop
  # per goroutine (cmd/worker/main.go), not three separate services.
  worker:
    build: .
    command: sh -c "./migrate && ./worker"
    environment:
      DATABASE_URL: postgres://webhooks:webhooks@postgres:5432/webhooks_go
      SECRET_ENCRYPTION_KEY: uVnfLJGuLvn8ZwxpLXFXIw8irrEhzVUIqM6SneLB6Sc=
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  go_postgres_data:
